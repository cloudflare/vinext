name: Setup Node.js and pnpm
description: Install pnpm, set up Node.js with cache, and install dependencies. Requires the repo to already be checked out.

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
