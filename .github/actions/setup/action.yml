name: Setup
description: Setup

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: "24"
  cache:
    description: Whether to enable caching for Vite+ dependencies
    required: false
    default: true
  run-install:
    description: Whether to run `vp install` after setup
    required: false
    default: true
  version:
    description: Vite+ version to install. Defaults to the workspace catalog entry.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve Vite+ version
      id: vite-plus-version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if [ -n "$INPUT_VERSION" ]; then
          version="$INPUT_VERSION"
        else
          version="$(node "$GITHUB_ACTION_PATH/resolve-vite-plus-version.cjs")"
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        run-install: ${{ inputs.run-install }}
        version: ${{ steps.vite-plus-version.outputs.version }}
