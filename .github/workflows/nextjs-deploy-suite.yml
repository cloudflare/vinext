name: Next.js Deploy Suite

# Runs the Next.js deploy suite against vinext once per Next.js version, in
# parallel. The versions tested by default (nightly, or a manual run with
# `next-refs` left empty) live in .github/nextjs-deploy-suite-versions.json.
# Each version is a separate call of nextjs-deploy-suite-run.yml with its own
# artifacts and its own published /compatibility series, so versions and
# overlapping runs never share state.
on:
  schedule:
    # Nightly at 02:00 UTC against main
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      vinext-ref:
        description: vinext branch/ref to test
        required: false
        default: main
        type: string
      next-refs:
        description: Comma-separated Next.js refs to test, e.g. `v16.4.6`. Empty = every version in .github/nextjs-deploy-suite-versions.json.
        required: false
        default: ""
        type: string
      suite-filter:
        description: Which suites to run (pages, app, or all)
        required: false
        default: all
        type: choice
        options:
          - app
          - pages
          - all
      test-path:
        description: Optional path filter — comma-separated, e.g. `test/e2e/edge-async-local-storage`. Empty = all.
        required: false
        default: ""
        type: string
      test-concurrency:
        description: Per-shard Next.js test concurrency
        required: false
        default: "2"
        type: string
      backfill-date:
        description: Optional historical date (YYYY-MM-DD) to reconstruct and publish from a full vinext commit SHA
        required: false
        default: ""
        type: string
      run-skipped-deployment-tests:
        description: Also run the real tests of suites that skip deploy mode (`skipDeployment`). Never published to /compatibility.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  versions:
    name: Resolve Next.js versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      next-refs: ${{ steps.resolve.outputs.next-refs }}
      vinext-sha: ${{ steps.vinext.outputs.sha }}
    steps:
      - name: Checkout vinext
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/nextjs-deploy-suite-versions.json
          sparse-checkout-cone-mode: false

      - name: Resolve Next.js versions
        id: resolve
        env:
          NEXT_REFS: ${{ inputs.next-refs }}
        run: |
          node <<'EOF'
          const fs = require('node:fs')
          const requested = (process.env.NEXT_REFS || '')
            .split(',')
            .map((ref) => ref.trim())
            .filter(Boolean)
          const refs = requested.length > 0
            ? requested
            : JSON.parse(fs.readFileSync('.github/nextjs-deploy-suite-versions.json', 'utf8'))
          const unique = [...new Set(refs)]
          if (unique.length === 0) throw new Error('No Next.js versions to test')
          console.log(`Next.js versions: ${unique.join(', ')}`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `next-refs=${JSON.stringify(unique)}\n`)
          EOF

      # Resolve `vinext-ref` to one commit here, so every version tests (and
      # is labelled with) the same vinext commit even if the branch moves
      # while the version jobs start.
      - name: Checkout vinext-ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.vinext-ref || github.sha }}
          path: pinned-vinext
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Resolve vinext commit
        id: vinext
        run: echo "sha=$(git -C pinned-vinext rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  suite:
    name: Next.js ${{ matrix.next-ref }}
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        next-ref: ${{ fromJSON(needs.versions.outputs.next-refs) }}
    uses: ./.github/workflows/nextjs-deploy-suite-run.yml
    with:
      vinext-ref: ${{ inputs.vinext-ref || '' }}
      vinext-sha: ${{ needs.versions.outputs.vinext-sha }}
      next-ref: ${{ matrix.next-ref }}
      suite-filter: ${{ inputs.suite-filter || 'all' }}
      test-path: ${{ inputs.test-path || '' }}
      test-concurrency: ${{ inputs.test-concurrency || '2' }}
      backfill-date: ${{ inputs.backfill-date || '' }}
      run-skipped-deployment-tests: ${{ inputs.run-skipped-deployment-tests || false }}
    secrets:
      COMPAT_INGEST_SECRET: ${{ secrets.COMPAT_INGEST_SECRET }}
