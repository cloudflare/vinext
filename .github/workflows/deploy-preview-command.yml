name: Deploy Preview (Command)

# Triggered by commenting "/deploy-preview" on a PR.
# Restricted to org members and collaborators. Use this to deploy
# previews for external contributor PRs that don't have secret access.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  check:
    name: Validate Command
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/deploy-preview') &&
      (
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.comment.author_association == 'OWNER'
      )
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - name: React to comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('number', pr.data.number);

  deploy:
    name: Deploy ${{ matrix.example.name }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - name: app-router-cloudflare
            project: app-router-cloudflare
            wrangler_config: dist/server/wrangler.json
          - name: pages-router-cloudflare
            project: pages-router-cloudflare
            wrangler_config: dist/pages_router_cloudflare/wrangler.json
          - name: app-router-playground
            project: app-router-playground
            wrangler_config: dist/server/wrangler.json
          - name: realworld-api-rest
            project: realworld-api-rest
            wrangler_config: dist/realworld_api_rest/wrangler.json
          - name: nextra-docs-template
            project: nextra-docs-template
            wrangler_config: dist/server/wrangler.json
          - name: benchmarks
            project: benchmarks
            wrangler_config: dist/server/wrangler.json
          - name: hackernews
            project: hackernews
            wrangler_config: dist/server/wrangler.json
    steps:
      - uses: ./.github/actions/build-vinext
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: ./.github/actions/deploy-example
        with:
          example-name: ${{ matrix.example.name }}
          wrangler-config: ${{ matrix.example.wrangler_config }}
          mode: preview
          preview-alias: pr-${{ needs.check.outputs.pr_number }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke-test:
    name: Smoke Test Previews
    needs: [check, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - name: Smoke test previews
        run: ./scripts/smoke-test.sh --preview pr-${{ needs.check.outputs.pr_number }}

  comment:
    name: Comment Preview URLs
    needs: [check, deploy]
    if: always() && needs.check.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: ./.github/actions/comment-preview-urls
        with:
          pr-number: ${{ needs.check.outputs.pr_number }}
