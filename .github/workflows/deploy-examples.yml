name: Deploy Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    name: Deploy ${{ matrix.example.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    strategy:
      fail-fast: false
      matrix:
        example:
          - name: cloudflare-app
            project: cloudflare-app
            dist_name: cloudflare_app
          - name: cloudflare-pages
            project: cloudflare-pages
            dist_name: cloudflare_pages
          - name: app-router-playground
            project: app-router-playground
            dist_name: app_router_playground
          - name: realworld-api-rest
            project: realworld-api-rest
            dist_name: realworld_api_rest
          - name: benchmarks
            project: benchmarks
            dist_name: benchmarks
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - name: Build vinext plugin
        run: pnpm run build

      - name: Build example
        run: pnpm exec vite build
        working-directory: examples/${{ matrix.example.name }}

      - name: Apply D1 migrations (benchmarks only)
        if: matrix.example.name == 'benchmarks' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: examples/benchmarks
          command: d1 migrations apply vinext-benchmarks --remote

      - name: Deploy to Cloudflare Workers (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: examples/${{ matrix.example.name }}
          command: deploy --config dist/${{ matrix.example.dist_name }}/wrangler.json

      - name: Deploy Preview Version
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: examples/${{ matrix.example.name }}
          command: versions upload --config dist/${{ matrix.example.dist_name }}/wrangler.json --preview-alias pr-${{ github.event.pull_request.number }}

  comment:
    name: Comment Preview URLs
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR with preview URLs
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const alias = `pr-${prNumber}`;
            
            const examples = [
              { name: 'cloudflare-app', project: 'cloudflare-app' },
              { name: 'cloudflare-pages', project: 'cloudflare-pages' },
              { name: 'app-router-playground', project: 'app-router-playground' },
              { name: 'realworld-api-rest', project: 'realworld-api-rest' },
              { name: 'benchmarks', project: 'benchmarks' },
            ];
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const marker = '<!-- vinext-deploy-previews -->';
            const existingComment = comments.find(c => c.body?.includes(marker));
            
            const previews = examples
              .map(e => `[${e.name}](https://${alias}-${e.project}.vinext.workers.dev)`)
              .join(' · ');
            
            const production = examples
              .map(e => `[${e.name}](https://${e.project}.vinext.workers.dev)`)
              .join(' · ');
            
            const body = [
              marker,
              `**Preview:** ${previews}`,
              `**Production:** ${production}`,
            ].join('\n');
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
