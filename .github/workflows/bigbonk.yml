name: Big Bonk

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  bonk:
    # The alcora-dev GitHub App is allowed by exact login: it is a Bot with no
    # author association, so it would fail the human checks below. Its comments
    # must start with /bigbonk so a triage reply that echoes reporter text can't
    # trigger a run.
    if: >-
      (
        github.event.comment.user.login == 'alcora-dev[bot]' &&
        startsWith(github.event.comment.body, '/bigbonk')
      ) ||
      (
        github.event.sender.type != 'Bot' &&
        contains(github.event.comment.body, '/bigbonk') &&
        (
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR' ||
          github.event.comment.author_association == 'OWNER'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 30 # 30 is a balance in providing enough context for the agent vs. pulling down the entire repo history. It is not a scientific number. 27 or 31 or 36 would likely work as well.

      - uses: ./.github/actions/setup

      - name: Run Bonk
        # Fork of Cloudflare-Studio/ask-bonk@2c20fe3 whose turn runner skips
        # `opencode github run`'s collaborator check, which refuses every GitHub App.
        uses: james-elicx/ask-bonk/github@8c2e3a3434ccebdd7cb4a74297774b22df30ef35 # app-actors
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_AI_GATEWAY_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CF_AI_GATEWAY_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          OPENCODE_CONFIG_CONTENT: '{"permission":{"external_directory":{"/home/runner/work/**":"allow"},"question":"deny","doom_loop":"deny"}}'
        with:
          # Stop Bonk before the job's timeout-minutes so it can report the outcome itself.
          timeout: "10m"
          oidc_base_url: https://ask-bonk.cloudflare-exponent.workers.dev/auth
          model: "cloudflare-ai-gateway/openai/gpt-5.6-sol"
          mentions: "/bigbonk"
          variant: "high"
          # ask-bonk checks the commenter's repo collaborator permission, which is
          # "none" for GitHub Apps; alcora-dev[bot] is already gated by login above.
          permissions: ${{ github.event.comment.user.login == 'alcora-dev[bot]' && 'any' || 'write' }}
          opencode_dev: true
          opencode_version: latest
          agent: viguy
